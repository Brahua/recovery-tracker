name: CI/CD

# Trunk-based: short-lived feature branches open PRs against main (CI only).
# Every push to main runs the same checks and, only if all of them pass, migrates the
# production Supabase project and deploys to production (https://recovery-tracker.brahua.com).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Production Supabase project (formerly "staging").
  SUPABASE_PROJECT_REF: pevrupenrzueyzidfeah

jobs:
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run design:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Supabase local + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Throwaway Supabase started in the runner; never the production project.
    # Demo mode is dev-only in the app; E2E runs a production build (for stable
    # hydration), so expose the demo entry point via this server-side flag. It is
    # never set on the real Vercel deploy, so demo stays hidden in production.
    env:
      ENABLE_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations + seed)
        run: npx supabase start

      # pgTAP tests in supabase/tests/ (auth hook, privileges) against the same throwaway database.
      - name: Database tests (pgTAP)
        run: npx supabase test db

      - name: Point app env at local Supabase
        run: npm run supabase:env:local

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app (E2E runs against a production build in CI)
        run: npm run build

      - name: Run critical E2E
        run: npm run e2e:critical

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One production deploy at a time, in merge order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name repository secret"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Migrations are additive and run before the app deploy; a failed migration
      # fails the job, so the app never ships against an old schema.
      - name: Apply migrations to production Supabase
        env:
          # The only place allowed to write to production (scripts/check-db-target.mjs).
          ALLOW_PROD_DB: "1"
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npm run supabase:push:linked

      - name: Pull production settings and env
        run: npx vercel@61.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel@61.1.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx vercel@61.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
